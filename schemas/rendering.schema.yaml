type: object
required: [strategy]
properties:
  strategy:
    type: object
    properties:
      renderer: { type: string, enum: [cairo, opengl] }
      quality: { type: string, enum: [ql, qm, qh], default: ql }
      sections:
        type: array
        items:
          type: object
          required: [scene_id, start, end]
          properties:
            scene_id: { type: string, pattern: '^S-\\d{3}$' }
            start: { type: number }
            end: { type: number }
      previews:
        type: array
        items:
          type: object
          required: [scene_id, start, end]
          properties:
            scene_id: { type: string, pattern: '^S-\\d{3}$' }
            start: { type: number }
            end: { type: number }
      cache: { type: boolean, default: true }
    additionalProperties: true
