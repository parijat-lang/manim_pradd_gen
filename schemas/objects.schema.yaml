type: object
required: [objects]
properties:
  objects:
    type: array
    items:
      type: object
      required: [object_id, name, type, tags, beats_used_in, properties]
      properties:
        object_id: { type: string, pattern: '^O-\\d{4}$' }
        name: { type: string }
        type:
          type: string
          enum: [Text, MathTex, VMobject, SVGMobject, ImageMobject, Axes, NumberPlane, Graph, Other]
        tags: { type: array, items: { type: string } }
        beats_used_in: { type: array, items: { type: string, pattern: '^B-\\d{3}$' } }
        properties: { type: object, additionalProperties: true }
