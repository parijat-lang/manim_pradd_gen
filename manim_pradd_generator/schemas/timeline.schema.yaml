type: object
required: [timeline]
properties:
  timeline:
    type: array
    items:
      type: object
      required: [scene_id, entries]
      properties:
        scene_id: { type: string, pattern: '^S-\\d{3}$' }
        entries:
          type: array
          items:
            type: object
            required: [t_start, t_end, mode, items]
            properties:
              t_start: { type: number }
              t_end: { type: number }
              mode: { type: string, enum: [parallel, serial] }
              items: { type: array, items: { type: string, pattern: '^(A|R|C)-\\d{4}$' } }
