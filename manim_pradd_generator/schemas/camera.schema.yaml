type: object
required: [camera]
properties:
  camera:
    type: array
    items:
      type: object
      required: [cam_id, scene_id, action, params, t_start, t_end]
      properties:
        cam_id: { type: string, pattern: '^C-\\d{4}$' }
        scene_id: { type: string, pattern: '^S-\\d{3}$' }
        action:
          type: string
          enum: [frame_move, frame_width, set_euler_angles, animate_to, ambient_light, restore]
        params: { type: object, additionalProperties: true }
        t_start: { type: number }
        t_end: { type: number }
